name: Frontend CI

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版は package.json の packageManager（pnpm）と engines.node（Node）から読む
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting with Prettier
        run: pnpm format:check

      - name: Lint with ESLint
        run: pnpm lint

      - name: Check project conventions
        run: pnpm check-conventions-merge

      - name: Type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      # 型検査とテストでは見つからない、Server Components の境界やルーティングの誤りを止める
      - name: Build
        run: pnpm build
