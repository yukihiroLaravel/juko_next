name: Frontend CI

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版は package.json の packageManager（pnpm）と engines.node（Node）から読む
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 整形・ESLint・規約・型検査・テスト・本番ビルドを順に流す。中身は package.json の check-all にあり、
      # Claude Code の Stop フック（scripts/hooks/stop-check.sh）も同じものを流す
      - name: Run all checks
        run: pnpm check-all
